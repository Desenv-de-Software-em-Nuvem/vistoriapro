<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>VistoriaPro</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/VistoriaPro.png" />
    <script>
      (function () {
        var isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        var cleanupVersion = '2026-05-14-sw-reset';
        var storageKey = 'vistoriapro-sw-cleanup-version';

        if (!('serviceWorker' in navigator)) {
          return;
        }

        if (!isLocalhost && localStorage.getItem(storageKey) === cleanupVersion) {
          return;
        }

        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          if (!registrations.length && !isLocalhost) {
            localStorage.setItem(storageKey, cleanupVersion);
            return;
          }

          return Promise.all(registrations.map(function (registration) {
            return registration.unregister();
          })).then(function () {
            if ('caches' in window) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) {
                  return caches.delete(key);
                }));
              });
            }
          }).then(function () {
            if (!isLocalhost) {
              localStorage.setItem(storageKey, cleanupVersion);
            }

            if (sessionStorage.getItem('vistoriapro-sw-cleanup-reload')) {
              return;
            }

            sessionStorage.setItem('vistoriapro-sw-cleanup-reload', '1');
            window.location.reload();
          });
        }).catch(function () {
          if (!isLocalhost) {
            localStorage.setItem(storageKey, cleanupVersion);
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
